name: Inspect completed-build compiler runtimes

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful controlled-build run ID (binding is derived and verified from its artifact)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Test read-only audit boundaries
        run: node --test scripts/audit-toolchain-runtime.test.mjs scripts/prepare-runtime-audit.test.mjs

      - name: Retrieve the exact successful build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: node scripts/prepare-runtime-audit.mjs

      - name: Provision the original immutable compiler image
        run: |
          image="$(node -p "JSON.parse(require('fs').readFileSync('runtime-audit-binding.json','utf8')).image")"
          docker pull "$image"

      - name: Inspect compiler archives offline without modifying the build
        run: node scripts/audit-toolchain-runtime.mjs audited-build run-metadata.json runtime-audit-binding.json runtime-audit

      - name: Retain only the provenance report, not toolchain binaries
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: runtime-audit-${{ inputs.build_run }}-${{ github.run_id }}
          path: runtime-audit/
          if-no-files-found: warn
          retention-days: 30
